openapi: 3.0.3
info:
  title: RSS Aggregator API
  description: REST API for aggregating news from RSS feeds
  version: 0.0.1-SNAPSHOT

paths:
  /api/articles:
    get:
      tags:
        - articles
      operationId: getArticles
      summary: Get paginated list of articles
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: sourceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          required: false
          description: Search by title
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'

  /api/sources:
    get:
      tags:
        - sources
      operationId: getSources
      summary: Get all sources
      responses:
        '200':
          description: List of all sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceDto'
    post:
      tags:
        - sources
      operationId: createSource
      summary: Add new RSS source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      
  /api/sources/{id}/toggle:
    put:
      tags:
        - sources
      operationId: toggleSource
      summary: Enable or disable a source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Source toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDto'
        '404':
          description: Source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sources/{id}:
    delete:
      tags:
        - sources
      operationId: deleteSource
      summary: Delete a source
      parameters:
        - name : id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Source deleted

components:
  schemas:
    SourceDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name: 
          type: string
        url:
          type: string
        category:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateSourceRequest:
      type: object
      required:
        - name
        - url
        - category
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          minLength: 1
          maxLength: 2048
        category:
          type: string
          minLength: 1
          maxLength: 100

    ArticleDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sourceId:
          type: integer
          format: int64
        sourceName:
          type: string
        title:
          type: string
        description:
          type: string
        url:
          type: string
        publishedAt:
          type: string
          format: date-time
        fetchedAt:
          type: string
          format: date-time

    ArticlePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ArticleDto'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time