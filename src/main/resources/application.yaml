spring:
  application:
    name: rssaggregator
  datasource:
    url: jdbc:postgresql://localhost:5433/rssaggregator
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

scheduling:
  rss-fetch-cron: "0 */10 * * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.example.rssaggregator: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    export:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
